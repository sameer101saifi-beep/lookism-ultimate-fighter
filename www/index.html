// ===== PVP STABILITY PATCH: CLEAN ENTRY STATES, CORRECT SIDES, BEST-OF-3 =====
(function(){
  const cleanFighter=(f,x,face)=>{
    if(!f)return;
    Object.assign(f,{
      x,y:0,vx:0,vy:0,face,st:'idle',tm:0,at:0,ad:null,ak:'',
      hi:0,fr:0,buf:0,stun:0,inv:0,dgd:0,dc:0,landT:0,
      po:null,xm:null,xe:null,al:null,buff:0,charging:false,
      trail:[],rt:0,uh:0,tp:0,fin:0,phantomT:0
    });
  };
  const fixBoth=()=>{
    cleanFighter(G.p1,250,1);
    cleanFighter(G.p2,710,-1);
    if(G.p1)G.p1.a=null;
    if(G.p2)G.p2.a=null;
  };

  // The cinematic's first completion used to leave P1 in its final animation pose.
  // Clean each fighter before moving to the next entrance, then clean both at the end.
  const ciEndStable=ciEnd;
  ciEnd=function(){
    if(G.mode==='pvp'&&G.ci){
      const current=G.ci.f;
      cleanFighter(current,current===G.p1?250:710,current===G.p1?1:-1);
    }
    ciEndStable();
    if(G.mode==='pvp'){
      if(G.ci){
        // P1 entrance has ended; P2 entrance is now active.
        cleanFighter(G.p1,250,1);
      }else{
        // Both entrances are complete. Never let cinematic attack states enter the round.
        fixBoth();
        G.intro=1.8;
        G.stop=0;
        $('skip').style.display='none';
        $('bar').style.display='flex';
      }
    }
  };

  // Skip only the current phase. A skipped VS card proceeds to P1's intro;
  // skipping an entrance completes that entrance through the normal cleanup path.
  const skipStable=skipIntro;
  skipIntro=function(){
    if(G.mode!=='pvp')return skipStable();
    const ci=G.ci;if(!ci)return;
    if(ci.ph==='vs'){
      ci.t=1.5;
      return;
    }
    if(ci.ph==='in'&&ci.d){
      ci.evi=ci.d.ev.length;
      ci.t=ci.d.dur;
    }
  };

  // Always retain the intended sides and inward-facing stance after the cinematic.
  const ciUpdStable=ciUpd;
  ciUpd=function(dt){
    ciUpdStable(dt);
    if(G.mode==='pvp'&&!G.ci&&G.s==='fight'){
      if(G.p1){G.p1.x=250;G.p1.face=G.p2&&G.p2.x>=G.p1.x?1:-1}
      if(G.p2){G.p2.x=710;G.p2.face=G.p1&&G.p1.x<=G.p2.x?-1:1}
    }
  };

  // Best-of-three: first player to win two rounds takes the match.
  G.pvpWins1=0;G.pvpWins2=0;G.pvpRound=1;
  const baseGo=go;
  go=function(s){
    if(G.mode==='pvp'&&s==='fight'&&G.s==='end'){
      G.pvpWins1=0;G.pvpWins2=0;G.pvpRound=1;
    }
    if(G.mode==='pvp'&&s==='end'&&G.s==='fight'&&G.win){
      if(G.win===G.p1)G.pvpWins1++;else G.pvpWins2++;
      const score1=G.pvpWins1,score2=G.pvpWins2;
      if(score1<2&&score2<2){
        G.pvpRound=score1+score2+1;
        G.over=0;G.ot=0;G.win=null;G.stop=0;G.ci=null;G.intro=2.1;
        G.p1=mk(CH[G.sel],250,1,0);
        G.p2=mk(CH[G.p2sel],710,-1,0);
        G.i1=G.sel;G.i2=G.p2sel;G.ar=G.selA;
        G.p1.a=null;G.p2.a=null;
        PR.length=0;FXs.length=0;
        $('skip').style.display='none';$('bar').style.display='flex';
        return;
      }
      $('et').textContent=score1>=2?'PLAYER 1 WINS THE MATCH':'PLAYER 2 WINS THE MATCH';
    }
    return baseGo(s);
  };

  // Put the round number and live match score on the fight HUD.
  const hudStable=hud;
  hud=function(){
    hudStable();
    if(G.mode==='pvp'&&G.s==='fight'&&!G.ci){
      T('ROUND '+(G.pvpRound||1)+'  ·  FIRST TO 2 WINS',W/2,48,20,'#ffe27a');
      T('P1  '+(G.pvpWins1||0)+'  -  '+(G.pvpWins2||0)+'  P2',W/2,72,17,'#fff');
      if(G.pvpRound===3)T('FINAL ROUND',W/2,104,24,'#ff5a5a');
    }
  };

  // A fresh PVP selection always starts at 0-0; rematch is also reset by go('fight').
  const menuPvp=[...$('menu').querySelectorAll('button')].find(b=>b.textContent.trim()==='PLAYER 1 VS PLAYER 2');
  if(menuPvp){
    const old=menuPvp.onclick;
    menuPvp.onclick=function(e){
      G.pvpWins1=0;G.pvpWins2=0;G.pvpRound=1;
      if(old)old.call(this,e);
    };
  }
})();

// ===== PLAYER VS AI: SHOW BOTH ORIGINAL CHARACTER ENTRY ANIMATIONS =====
(function(){
  const ciStartBeforeAiEntries=ciStart;
  const ciEndBeforeAiEntries=ciEnd;

  function makeEntry(f, mirror){
    const name=f.ch.n;
    const lines=LN[name]||LN['GUN PARK']||['Let us begin.'];
    const line=lines[Math.floor(M.random()*lines.length)];
    const source=INT[name]||INT['GUN PARK'];
    const data=mirror
      ? {...source,keys:source.keys.map(k=>({...k,
          x:k.x==null?undefined:W-k.x,
          cx:k.cx==null?undefined:W-k.cx
        }))}
      : source;
    G.ci={ph:'in',t:0,d:data,line,evi:0,f,cur:null};
    G.intro=0;
    $('skip').style.display='block';
    $('bar').style.display='none';
  }

  // AI matches: player's own selected-character entrance first, then opponent.
  // Training, Combo Practice, Showcase and PVP keep their own existing flows.
  ciStart=function(){
    if(G.mode!=='ai')return ciStartBeforeAiEntries();
    if(!G.p1||!G.p2)return ciStartBeforeAiEntries();
    makeEntry(G.p1,true);
  };

  ciEnd=function(){
    if(G.mode==='ai'&&G.ci&&G.ci.f===G.p1){
      // Finish P1's cinematic cleanly before starting the opponent's own entrance.
      Object.assign(G.p1,{
        x:250,y:0,face:1,st:'idle',ad:null,at:0,po:null,
        xm:null,xe:null,buff:0,al:null,trail:[],tm:0
      });
      G.p1.al=null;
      makeEntry(G.p2,false);
      return;
    }
    return ciEndBeforeAiEntries();
  };
})();

const add=o=>{if(P.length>=MAX)P.splice(0,40);if(o.m==null)o.m=o.l;P.push(o)};
function glow(col){let o=glowC[col];if(!o){o=glowC[col]=document.createElement('canvas');o.width=o.height=64;const g=o.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'#fff');r.addColorStop(.3,col);r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,64,64)}return o}
const spark=(x,y,col,n,v0,up)=>{for(let i=0;i<n;i++){const a=R()*6.283,v=v0*(.4+R()*.8);add({t:'sp2',x,y,vx:M.cos(a)*v,vy:M.sin(a)*v-(up||0),g:520,dr:.25,l:.35+R()*.3,r:5+R()*6,col:i%3?col:'#fff'})}};
const dust=(x,y,n,dir,sz)=>{for(let i=0;i<n;i++)add({t:'dust',x:x+(R()-.5)*30,y:y-2-R()*6,vx:(dir||(R()<.5?-1:1))*(30+R()*90)*(R()<.7?1:-.5),vy:-(10+R()*40),dr:.08,r:(sz||9)+R()*6,l:.4+R()*.25})};
const star=(x,y,r,col,l)=>add({t:'star',x,y,r,col,l:l||.2,rot:R()*6.28,n:7+(R()*3|0)});
const rays=(x,y,n,r,len,col,l)=>add({t:'rays',x,y,n,r,len,col,l:l||.24,a0:R()*6.28});
const slash=(x,y,ang,len,w,col,l)=>add({t:'slash',x,y,ang,len,w,col,l:l||.17});
const ring=(x,y,vr,col,l,flat)=>FXs.push({ty:'ring',x,y,r:6,vr,sy:flat?1:0,l:l||.3,m:l||.3,col});
const pow=(x,y,s,col)=>{if(powCD>0)return;powCD=.22;add({t:'pow',x,y,s,col,rot:(R()-.5)*.5,w:WORDS[R()*WORDS.length|0],l:.55})};
const fg=()=>[G.p1,G.p2];

function impact(f,o,ad){
 if(G.s!=='fight')return;
 const dir=f.face,x=o.x-dir*10,y=FY+o.y-95,col=f.ch.col,ult=!!ad.ult,fin=ult&&ad.dm>=13,hv=!!ad.hv,gnd=o.y===0,base=dir>0?0:PI;
 if(ult&&!fin){star(x,y,36,col,.16);spark(x,y,col,3,300);return}
 if(fin){
  star(x,y,125,col,.3);rays(x,y,26,30,230,'#fff',.35);rays(x,y,16,20,170,col,.4);
  ring(x,y,760,'#fff',.45);ring(x,FY,520,col,.55,1);ring(x,y,430,col,.5);
  add({t:'sp2',x,y,vx:0,vy:0,r:210,col,l:.4});spark(x,y,col,16,620,120);
  dust(x,FY,8,dir,13);for(let i=0;i<8;i++)add({t:'deb',x:x+(R()-.5)*60,y:FY-4,vx:dir*(80+R()*260),vy:-(240+R()*380),g:1500,w:3+R()*5,rot:R()*6,vr:(R()-.5)*18,col:'#6b5d52',l:.8});
  slash(x,y,base-.3,260,12,'#fff',.28);slash(x,y,base+.3,240,10,col,.28);pow(x,y-70,70,col);return}
 // normal hit
 const k=ad.k;let ang=base;if(k==='u')ang=base-dir*1.1;else if(k==='k')ang=base+dir*.35;
 star(x,y,hv?54:30,hv?col:'#fff',hv?.22:.15);
 add({t:'sp2',x,y,vx:0,vy:0,r:hv?95:50,col,l:.18});
 slash(x,y,ang+(R()-.5)*.4,hv?170:100,hv?8:5,'#fff',.17);slash(x,y,ang+(R()-.5)*.8,hv?130:80,hv?6:4,col,.2);
 if(hv)slash(x,y,ang+(R()-.5)*1.2,120,5,'#fff',.2);
 spark(x,y,col,hv?10:5,hv?460:300,40);
 if(hv){
  rays(x,y,14,14,95,'#fff',.25);ring(x,y,400,col,.3);
  if(gnd){dust(o.x,FY,5,dir,9);for(let i=0;i<3;i++)add({t:'deb',x:o.x,y:FY-4,vx:dir*(60+R()*180),vy:-(160+R()*260),g:1500,w:2+R()*4,rot:R()*6,vr:(R()-.5)*16,col:'#6b5d52',l:.6})}
  if(R()<.6)pow(x+dir*10,y-50,34+R()*14,col)}
 if(o.st==='ko'&&o.tm===0){ // K.O. blow
  star(x,y,170,'#fff',.4);rays(x,y,30,40,300,'#fff',.45);ring(x,y,900,'#fff',.55);ring(x,FY,600,col,.6,1);ring(x,y,520,'#ffd34a',.5);
  spark(x,y,'#ffd34a',20,700,150);dust(o.x,FY,8,dir,14);G.stop=M.max(G.stop,.22);G.sh=M.max(G.sh,26);G.flash=M.max(G.flash,.6)}
}
function blockFx(x){
 if(G.s!=='fight')return;let b=null,bd=999;for(const f of fg())if(f&&f.st==='block'&&M.abs(f.x-x)<bd){bd=M.abs(f.x-x);b=f}
 if(!b)return;const sx=b.x+b.face*26,y=FY+b.y-95;
 add({t:'shield',x:sx,y,r:58,face:b.face,col:'#9fe8ff',l:.28});add({t:'sp2',x:sx+b.face*14,y,vx:0,vy:0,r:60,col:'#9fe8ff',l:.16});
 ring(sx,y,300,'#9fe8ff',.22);spark(sx+b.face*10,y,'#bff',6,320,0);
 if(blkCD<=0){blkCD=.45;add({t:'pow',x:sx,y:y-62,s:22,col:'#9fe8ff',rot:-.1,w:'BLOCK',l:.4})}
}
function castFx(f){
 if(G.s!=='fight')return;const x=f.x+f.face*50,y=FY+f.y-100,col=f.ch.col;
 add({t:'sp2',x,y,vx:0,vy:0,r:70,col,l:.22});ring(x,y,320,col,.28);ring(f.x,FY,260,col,.4,1);spark(x,y,col,6,280,0)}
function ultStart(f){
 const x=f.x,y=FY+f.y-100,col=f.ch.col;
 rays(x,y,28,60,320,'#fff',.5);rays(x,y,18,40,240,col,.6);ring(x,FY,900,col,.7,1);ring(x,FY,520,'#fff',.6,1);ring(x,y,640,col,.5);
 add({t:'sp2',x,y,vx:0,vy:0,r:240,col,l:.5});
 for(let i=0;i<18;i++)add({t:'sp2',x:x+(R()-.5)*90,y:FY-R()*20,vx:(R()-.5)*50,vy:-(220+R()*420),g:-60,dr:.6,l:.8+R()*.5,r:5+R()*7,col:i%3?col:'#fff'});dust(x,FY,8,0,13)}

// ---- wrap game functions (originals still run first / untouched)
const _hurt=hurt;hurt=function(f,o,ad){const c0=f.cmb;_hurt(f,o,ad);if(f.cmb>c0)impact(f,o,ad)};
const _burst=burst;burst=function(x,y,col,n){_burst(x,y,col,n);if(col==='#fff'&&y===FY-80&&(n===5||n===6))blockFx(x)};
const _sa=startAtk;startAtk=function(f,k){_sa(f,k);if(f.ad&&f.ad.sp&&G.s==='fight'&&f.ak!=='combo')castFx(f)};
const _su=startUlt;startUlt=function(f,o){_su(f,o);ultStart(f)};

const _step=step;step=function(dt){const t0=G.t;_step(dt);
 if(G.s!=='fight'){if(P.length)P.length=0;return}
 if(G.t===t0)return; // paused
 powCD-=dt;blkCD-=dt;fr++;
 for(let i=P.length-1;i>=0;i--){const p=P[i];p.l-=dt;if(p.l<=0){P.splice(i,1);continue}
  if(p.vx||p.vy){p.x+=p.vx*dt;p.y+=p.vy*dt}if(p.g)p.vy+=p.g*dt;if(p.dr){const d=M.pow(p.dr,dt);p.vx*=d;p.vy*=d}if(p.vr)p.rot+=p.vr*dt;
  if(p.t==='deb'&&p.y>FY){p.y=FY;p.vy*=-.3;p.vx*=.6}}
 for(const f of fg()){if(!f)continue;const pv=f._fp||(f._fp={st:f.st,y:0,vy:0,dash:0});
  if(f.st==='dodge'&&pv.st!=='dodge'){dust(f.x,FY,4,-M.sign(f.vx||1),8);for(let j=0;j<3;j++)slash(f.x-M.sign(f.vx||1)*20,FY+f.y-40-j*28,f.vx>0?PI:0,110,4,'#8ff',.22)}
  if(f.y===0&&pv.y<0&&pv.vy>350){dust(f.x,FY,5,0,9);ring(f.x,FY,260,'#fff',.25,1)}
  const dsh=f.st==='atk'&&f.ad&&f.ad.dash?1:0;if(dsh&&!pv.dash){dust(f.x,FY,6,-f.face,11);ring(f.x,FY,300,f.ch.col,.3,1)}
  if(dsh&&fr%3===0)dust(f.x-f.face*10,FY,1,-f.face,6);
  if(f.charging&&fr%3===0)add({t:'sp2',x:f.x+(R()-.5)*60,y:FY+f.y-R()*30,vx:0,vy:-(90+R()*130),g:-40,l:.6,r:4+R()*5,col:R()<.5?f.ch.col:'#fff'});
  pv.st=f.st;pv.y=f.y;pv.vy=f.vy;pv.dash=dsh}
 for(const p of PR){if(P.length>MAX-30)break;
  if(p.t==='moon'){add({t:'sp2',x:p.x-p.dir*R()*24,y:FY+p.y+(R()-.5)*40,vx:-p.dir*40,vy:(R()-.5)*60,dr:.3,l:.28,r:5+R()*6,col:R()<.4?'#fff':p.col});if(fr%2===0)slash(p.x-p.dir*30,FY+p.y+(R()-.5)*50,p.dir>0?PI:0,50+R()*40,3,p.col,.14)}
  else if(fr%2===0){dust(p.x-p.dir*14,FY,1,-p.dir,8);add({t:'deb',x:p.x,y:FY-6,vx:-p.dir*(20+R()*60),vy:-(180+R()*260),g:1500,w:2+R()*3,rot:R()*6,vr:(R()-.5)*14,col:'#6b5d52',l:.5})}}
};

// ---- drawing
function band(cx,cy,r0,r1,aA,aB){const lo=M.min(aA,aB),hi=M.max(aA,aB);c.beginPath();c.arc(cx,cy,r1,lo,hi);c.arc(cx,cy,r0,hi,lo,true);c.closePath();c.fill()}
function swing(f){const ad=f.ad;if(!ad)return;const p=f.at/ad.d;if(p<.2||p>.8)return;
 const t=(p-.2)/.6,a=M.sin(t*PI),col=f.ch.col,k=ad.k,ak=f.ak,r=ad.r||80;
 c.save();c.translate(f.x,FY+f.y);c.scale(f.face,1);c.globalCompositeOperation='lighter';
 const streaks=(n,y0,dy,len)=>{for(let j=0;j<n;j++){const y=y0+(j-(n-1)/2)*dy,x0=24,x1=x0+len*(.35+.65*t);c.beginPath();c.moveTo(x0,y);c.lineTo(x1,y-4*a-1);c.lineTo(x1+10,y);c.lineTo(x1,y+4*a+1);c.closePath();c.globalAlpha=.55*a;c.fillStyle=col;c.fill();c.globalAlpha=.8*a;c.fillStyle='#fff';c.beginPath();c.moveTo(x0+10,y);c.lineTo(x1,y-1.6);c.lineTo(x1+6,y);c.lineTo(x1,y+1.6);c.closePath();c.fill()}};
 const sweep=(cx,cy,aS,aE,r0,r1)=>{const cur=aS+(aE-aS)*t,dr=aE>aS?-1:1;for(let j=0;j<3;j++){const tail=cur+dr*(.9*(1-j*.3));c.globalAlpha=(j?.3:.38)*a;c.fillStyle=j?col:'#fff';band(cx,cy,r0+j*3,r1,cur,tail)}c.globalAlpha=.9*a;c.strokeStyle='#fff';c.lineWidth=2.5;c.beginPath();c.arc(cx,cy,r1,cur-.04,cur+.04);c.stroke()};
 if(ad.dash){for(let j=0;j<6;j++){const y=-26-j*17,len=(60+j*12)*a;c.globalAlpha=.5*a;c.fillStyle=j%2?col:'#fff';c.beginPath();c.moveTo(-6,y);c.lineTo(-6-len,y-1);c.lineTo(-6-len,y+1);c.closePath();c.fill();c.fillRect(-6-len,y-1.5,len,3)}}
 else if(ak==='palm'){const x=r*.85,s=22+16*a;c.globalAlpha=.85*a;c.drawImage(glow(col),x-s*1.6,-100-s*1.6,s*3.2,s*3.2);c.globalAlpha=.4*a;c.fillStyle=col;c.beginPath();c.moveTo(26,-100);c.lineTo(x+40*t,-100-48*a);c.lineTo(x+40*t,-100+48*a);c.closePath();c.fill();streaks(3,-100,10,r*.7)}
 else if(ak==='wave'){const s=20+22*t;c.globalAlpha=.9*a;c.drawImage(glow(col),50-s*1.6,-95-s*1.6,s*3.2,s*3.2);c.globalAlpha=.7*a;c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.arc(50,-95,60*(1-t)+8,0,7);c.stroke()}
 else if(ak==='quake'){c.globalAlpha=.8*a;c.strokeStyle=col;c.lineWidth=3;for(let j=0;j<3;j++){c.beginPath();c.ellipse(40+j*36*t,0,18+60*t+j*14,5+12*t,0,0,7);c.globalAlpha=(.7-j*.18)*a;c.stroke()}const s=26+20*a;c.globalAlpha=.7*a;c.drawImage(glow(col),20-s,-30-s,s*2,s*2)}
 else if(ak==='combo'){const fl=.55+.45*M.sin(p*40);if(k==='k'){c.globalAlpha=fl;sweep(0,-52,.8-(((p*6)%1)*1.4),-.5,r*.55,r*.95)}else{streaks(4,-100,13,r*.9)}}
 else if(ak==='p3'||k==='u')sweep(14,-70,.5,-1.5,r*.55,r*.95);
 else if(ak==='air')sweep(14,-110,-1.1,1.0,r*.5,r*.9);
 else if(k==='k')sweep(0,-52,.75,-.55,r*.55,r*.98);
 else streaks(2,-100,12,r*.95);
 c.restore()}
const _fx=fxDraw;
fxDraw=function(){_fx();if(G.s!=='fight')return;
 c.save();c.globalCompositeOperation='lighter';
 if(!G.ci){for(const f of fg())if(f&&f.st==='atk')swing(f)}
 for(const p of PR){const s=p.t==='moon'?70:60;c.globalAlpha=.7;c.drawImage(glow(p.col),p.x-s,FY+(p.t==='moon'?p.y:-24)-s,s*2,s*2)}
 c.restore();
 if(!P.length)return;
 c.save();
 for(const p of P){const a=p.l/p.m,k=1-a;c.globalAlpha=M.min(1,a*1.4);
  switch(p.t){
  case 'star':{const r=p.r*(.55+.6*M.min(1,k*3.5)),n=p.n;c.globalCompositeOperation='lighter';c.fillStyle=p.col;c.beginPath();for(let i=0;i<n*2;i++){const rr=i%2?r*.36:r,an=p.rot+i*PI/n;c.lineTo(p.x+M.cos(an)*rr,p.y+M.sin(an)*rr)}c.closePath();c.fill();c.fillStyle='#fff';c.globalAlpha=a;c.beginPath();for(let i=0;i<n*2;i++){const rr=i%2?r*.2:r*.58,an=p.rot+i*PI/n;c.lineTo(p.x+M.cos(an)*rr,p.y+M.sin(an)*rr)}c.closePath();c.fill();break}
  case 'rays':{c.globalCompositeOperation='lighter';c.strokeStyle=p.col;c.lineWidth=1+3*a;c.beginPath();for(let i=0;i<p.n;i++){const an=p.a0+i*6.283/p.n+M.sin(i*12.99)*.12,r0=p.r+p.len*.55*k,r1=r0+p.len*(.45+.3*M.sin(i*7.1)*.5)*a;c.moveTo(p.x+M.cos(an)*r0,p.y+M.sin(an)*r0);c.lineTo(p.x+M.cos(an)*r1,p.y+M.sin(an)*r1)}c.stroke();break}
  case 'slash':{c.globalCompositeOperation='lighter';const L=p.len*(.45+.55*M.min(1,k*4)),w=p.w*a,ca=M.cos(p.ang),sa=M.sin(p.ang),x0=p.x-ca*L*.5,y0=p.y-sa*L*.5,x1=p.x+ca*L*.5,y1=p.y+sa*L*.5;
   c.fillStyle=p.col;c.beginPath();c.moveTo(x0,y0);c.lineTo(p.x-sa*w,p.y+ca*w);c.lineTo(x1,y1);c.lineTo(p.x+sa*w,p.y-ca*w);c.closePath();c.fill();break}
  case 'sp2':{c.globalCompositeOperation='lighter';const s=p.r*(.4+.8*a);c.drawImage(glow(p.col),p.x-s,p.y-s,s*2,s*2);break}
  case 'dust':{c.globalCompositeOperation='source-over';c.globalAlpha=a*.38;c.fillStyle='#b9a99a';c.beginPath();c.arc(p.x,p.y,p.r*(1+1.3*k),0,7);c.fill();break}
  case 'deb':{c.globalCompositeOperation='source-over';c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.col;c.fillRect(-p.w/2,-p.w/2,p.w,p.w*.7);c.restore();break}
  case 'shield':{c.globalCompositeOperation='lighter';c.save();c.translate(p.x,p.y);c.scale(p.face,1);const r=p.r*(.78+.35*M.min(1,k*3));c.globalAlpha=a*.22;c.fillStyle=p.col;c.beginPath();c.moveTo(0,0);c.arc(0,0,r,-1.1,1.1);c.closePath();c.fill();c.globalAlpha=a;c.strokeStyle='#fff';c.lineWidth=2+4*a;c.beginPath();c.arc(0,0,r,-1.1,1.1);c.stroke();c.strokeStyle=p.col;c.lineWidth=1.5;c.beginPath();c.arc(0,0,r*.72,-.95,.95);c.stroke();c.restore();break}
  case 'pow':{c.globalCompositeOperation='source-over';const s=p.s*(1+.5*M.max(0,1-k*6))*(a<.25?a*4:1);c.save();c.translate(p.x,p.y-30*k);c.rotate(p.rot);c.font='italic '+s+'px Impact,sans-serif';c.textAlign='center';c.lineJoin='round';c.lineWidth=s/4;c.strokeStyle='#000';c.strokeText(p.w,0,0);c.lineWidth=s/9;c.strokeStyle=p.col;c.strokeText(p.w,0,0);c.fillStyle='#fff';c.fillText(p.w,0,0);c.restore();break}
  }}
 c.restore()};
}catch(e){console.error(e)}})();
